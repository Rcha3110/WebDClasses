<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <form action="https://localhost:8000/form">
        <p>Username</p>
        <input type="text" name="username" minlength="3" placeholder="Enter Username" required>
        <p>password</p>
        <input type="password" name="password" placeholder="Enter Password" maxlength="5" required>
        <br><br>
        <input type="button" value="Login">

    </form>
    <br>
        <p>Select City</p>
        <select name="city">
            <option disabled selected>select city</option>
            <option value="madrid">Madrid</option>
            <option value="barcelona">barcelona</option>
            <option value="valencia">valencia</option>
            <option value="seville">seville</option>
        </select>
        <hr>
        <p>Country</p>
        <select name="Country">
            <optgroup label="Europe">
            <option value="France">France</option>
            <option value="Spain">Spain</option>
            <option value="Greece">Greece</option>
            <option value="Portugal">Portugal</option>
            <option value="Italy">Italy</option>
            <option value="Germany">Germany</option>
            </optgroup>
            <optgroup label="Asia">
            <option value="India">Inida</option>
            <option value="China">China</option>
            <option value="Japan">Japan</option>
            <option value="Korea">Korea</option>
            </optgroup>
        </select>

</body>
</html>
